# Google Colab GPU configuration for Multi-Digit Handwritten Sequence Recognition

project:
  name: "multi-digit-sequence-recognition"
  seed: 42
  device: "cuda"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  metadata_filename: "metadata.csv"
  supported_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".bmp"
  label_extraction:
    mode: "filename_suffix"
    delimiter: "_"
    allow_no_delimiter: false
    annotation_file: null
    image_col: "image_path"
    label_col: "label"
  min_sequence_length: 1
  max_sequence_length: 5
  split:
    val_ratio_from_train: 0.15
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    stratify_by_length: true

image:
  height: 32
  width: 160
  pad_mode: "right"
  pad_value: 0
  normalize_mean: 0.0
  normalize_std: 1.0

model:
  encoder_dim: 256
  embed_dim: 64
  decoder_hidden_dim: 256
  attention_dim: 128
  num_layers: 1
  dropout: 0.1

training:
  batch_size: 64
  num_workers: 2 # Safe & fast multiprocessing DataLoader on Linux / Google Colab
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0
  teacher_forcing_ratio: 0.5
  teacher_forcing_start: 0.8
  teacher_forcing_end: 0.3
  grad_clip_norm: 5.0
  early_stopping_patience: 8
  lr_scheduler:
    enabled: true
    factor: 0.5
    patience: 2
    min_lr: 1.0e-6
  checkpoint_dir: "checkpoints"
  best_checkpoint_name: "best_model.pt"
  final_checkpoint_name: "final_model.pt"
  output_dir: "outputs"

inference:
  max_decode_length: 6
